plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raygold.netflixdpad'
    compileSdk 34

    defaultConfig {
        applicationId "com.raygold.netflixdpad"
        minSdk 24
        targetSdk 32
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
