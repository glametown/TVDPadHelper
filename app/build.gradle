plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raygold.netflixdpad'
    compileSdk 34

    defaultConfig {
        applicationId "com.raygold.netflixdpad"
        minSdk 24
        targetSdk 32
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        debug {
            // With minSdk 24 AGP signs with v2+ only. Some projector/TV firmware ships a custom
            // package installer that only understands the classic v1 (JAR) signature and reports
            // "failed to parse package", so sign with both schemes.
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
