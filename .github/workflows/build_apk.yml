name: Build Netflix D-Pad Helper APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack ZIP if uploaded as ZIP and Fix Manifest
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          GRADLE_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle not found in repository!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          # Ensure AndroidManifest.xml does not have the legacy package attribute that fails in AGP 8+
          sed -i 's/package="com.raygold.netflixdpad"//g' app/src/main/AndroidManifest.xml
          gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Netflix-DPad-Helper-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
