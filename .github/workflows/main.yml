name: Build Netflix D-Pad Helper APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          if [ -f "NetflixDpadHelper/settings.gradle" ]; then
            cd NetflixDpadHelper
          fi
          gradle assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Netflix-DPad-Helper-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
